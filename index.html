<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBC Micro</title>
    <!-- No favicon yet: an empty data: URL stops the browser requesting /favicon.ico (a 404). -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f6f6f4;
        --fg: #1d1d1b;
        --muted: #6b6b66;
        --panel: #ffffff;
        --border: #d6d6d0;
        --accent: #b3261e;
        --changed: #ffe08a;
        --written: #1565c0;
        --error: #b3261e;
        --flag-on: #2e7d32;
        --flag-on-fg: #ffffff;
        /* Memory map regions (Stage 21). */
        --region-ram: #c8e6c9;
        --region-sideways: #ffe0b2;
        --region-mos: #bbdefb;
        --region-fred: #e1bee7;
        --region-jim: #f8bbd0;
        --region-sheila: #ffcdd2;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161614;
          --fg: #e8e8e3;
          --muted: #9a9a92;
          --panel: #20201d;
          --border: #3a3a35;
          --accent: #ff8a80;
          --changed: #6b5413;
          --written: #64b5f6;
          --error: #ff8a80;
          --flag-on: #66bb6a;
          --flag-on-fg: #0b1f0c;
          --region-ram: #1f3d22;
          --region-sideways: #4a3313;
          --region-mos: #17324d;
          --region-fred: #3d2342;
          --region-jim: #4a1f30;
          --region-sheila: #4d1f1f;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.4rem;
      }
      .layout {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
      .screen-column {
        flex: 0 1 640px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #screen {
        background: #000;
        max-width: 100%;
      }
      #under-screen .panel:last-child {
        margin-bottom: 0;
      }
      #workbench {
        flex: 1 1 560px;
        min-width: 0;
      }
      .workbench-target {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px 12px;
        margin-bottom: 16px;
        overflow-x: auto;
      }
      .panel h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px;
        font-size: 0.95rem;
      }
      .panel > [hidden] {
        display: none !important;
      }
      .panel.collapsed {
        padding-bottom: 8px;
      }
      .panel.collapsed h2 {
        margin-bottom: 0;
      }
      .panel-toggle {
        width: 1.6em;
        height: 1.6em;
        padding: 0;
        line-height: 1;
        font-size: 0.95rem;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .memory-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .memory-message {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .memory-message.error {
        color: var(--error);
      }
      .memory-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .memory-table th {
        color: var(--muted);
        font-weight: normal;
        padding: 1px 6px 1px 2px;
        text-align: left;
      }
      .memory-table td {
        padding: 1px 3px;
      }
      .memory-table td.byte {
        cursor: pointer;
        border-radius: 3px;
      }
      .memory-table td.byte:hover {
        outline: 1px solid var(--accent);
      }
      .memory-table td.byte.changed {
        background: var(--changed);
      }
      /* Written by the CPU in the last run: a bar under the byte, so it can
         combine with the "changed" fill and the PC outline. */
      .memory-table td.byte.written {
        box-shadow: inset 0 -3px 0 var(--written);
        font-weight: 600;
      }
      .memory-writes {
        margin: 8px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .memory-writes .write-link {
        font: inherit;
        font-family: ui-monospace, monospace;
        color: var(--written);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
      }
      .memory-table td.byte.pc {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .memory-table td.ascii {
        padding-left: 10px;
        white-space: pre;
      }
      .byte-edit {
        width: 2.5ch;
        font: inherit;
        padding: 0;
      }
      .registers-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.9rem;
      }
      .registers-table th {
        text-align: left;
        padding: 1px 12px 1px 2px;
        color: var(--muted);
        font-weight: normal;
      }
      .registers-table td {
        padding: 1px 12px 1px 2px;
      }
      .registers-table td.binary {
        white-space: pre;
      }
      .registers-table .bit {
        color: var(--muted);
      }
      .registers-table .bit.on {
        color: inherit;
        font-weight: bold;
      }
      .registers-table .bit.changed {
        background: var(--changed);
        border-radius: 2px;
      }
      .registers-table td.detail {
        color: var(--muted);
      }
      .registers-table tr.changed td.value {
        background: var(--changed);
      }
      .flags {
        display: flex;
        gap: 4px;
        margin: 8px 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .flag {
        display: inline-block;
        width: 1.8em;
        text-align: center;
        padding: 2px 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
      }
      .flag.on {
        background: var(--flag-on);
        border-color: var(--flag-on);
        color: var(--flag-on-fg);
      }
      .flag.not-stored {
        border-style: dashed;
        opacity: 0.55;
      }
      .flag.changed {
        outline: 2px solid var(--changed);
      }
      .cpu-line {
        margin: 4px 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .cpu-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      .cpu-message {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .cpu-message.error {
        color: var(--error);
      }
      .listing-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .listing-table th {
        text-align: left;
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
      }
      .listing-table td {
        padding: 1px 10px 1px 2px;
        white-space: nowrap;
      }
      .listing-table td.marker {
        color: var(--accent);
        width: 1ch;
      }
      .listing-table td.comment {
        color: var(--muted);
        font-family: system-ui, sans-serif;
      }
      .listing-table tr.current td {
        background: var(--changed);
      }
      .listing-table tr.current td.comment {
        color: var(--fg);
      }
      .listing-table tr.modified td.bytes {
        text-decoration: line-through;
      }
      .disasm-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 4px;
      }
      .disasm-message {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .disasm-message.error {
        color: var(--error);
      }
      .disasm-heading {
        margin: 8px 0 2px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .disasm-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .disasm-table th {
        text-align: left;
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
      }
      .disasm-table td {
        padding: 1px 10px 1px 2px;
        white-space: nowrap;
      }
      .disasm-table td.marker {
        color: var(--accent);
        width: 1ch;
      }
      .disasm-table td.label {
        color: var(--written);
      }
      .disasm-table td.when {
        color: var(--muted);
        font-family: system-ui, sans-serif;
      }
      .disasm-ran td {
        color: var(--muted);
      }
      .disasm-ran tr.changed-since td.bytes {
        text-decoration: line-through;
      }
      .disasm-next tr.current td {
        background: var(--changed);
      }
      .disasm-empty,
      .disasm-interrupt,
      .disasm-note {
        margin: 4px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .disasm-interrupt {
        color: var(--accent);
      }
      .listing-note {
        margin: 6px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .asm-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .asm-source {
        box-sizing: border-box;
        width: 100%;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
        line-height: 1.4;
        tab-size: 8;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        resize: vertical;
      }
      .asm-status {
        margin: 6px 0 0;
        font-size: 0.85rem;
      }
      .asm-status.error {
        color: var(--error);
      }
      .asm-errors {
        margin: 4px 0 0;
        padding-left: 1.4em;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
        color: var(--error);
      }
      .asm-errors:empty {
        display: none;
      }
      .asm-symbols {
        margin: 4px 0 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .explorer-form,
      .explorer-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 0.85rem;
      }
      .explorer-field input,
      .explorer-field select {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .explorer-presets {
        gap: 6px;
        color: var(--muted);
      }
      .explorer-instruction {
        margin: 8px 0 4px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .explorer-instruction code {
        font-weight: bold;
        margin-right: 16px;
      }
      .explorer-bytes {
        color: var(--muted);
      }
      .explorer-steps {
        margin: 4px 0;
        padding-left: 1.6em;
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .explorer-steps li.warn {
        background: var(--changed);
        border-radius: 3px;
      }
      .explorer-result,
      .explorer-cycles {
        margin: 4px 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .explorer-result.error {
        color: var(--error);
      }
      .converter-form {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        max-width: 22rem;
        font-size: 0.85rem;
      }
      .converter-field {
        display: contents;
      }
      .converter-field input {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        min-width: 0;
      }
      .converter-field input[aria-invalid='true'] {
        outline: 2px solid var(--error);
      }
      .converter-status {
        margin: 8px 0 4px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .converter-status.error {
        color: var(--error);
      }
      .converter-notes {
        margin: 4px 0 0;
        padding-left: 1.4em;
        font-size: 0.8rem;
        line-height: 1.5;
        color: var(--muted);
      }
      /* Stack panel (Stage 15): page 1 from &01FF down to just below S. */
      .stack-summary {
        margin: 0 0 6px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      /* Stage 16: where an RTS would go if it ran now. */
      .stack-rts {
        margin: -2px 0 6px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .stack-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .stack-table th {
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
        text-align: left;
      }
      .stack-table td {
        padding: 1px 10px 1px 3px;
      }
      .stack-table tr.free td,
      .stack-table tr.free th {
        opacity: 0.45;
      }
      .stack-table tr.next-push {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .stack-table td.note {
        color: var(--muted);
      }
      .stack-table tr.next-push td.note {
        color: var(--accent);
        font-weight: 600;
      }
      .stack-table td.hex.changed {
        background: var(--changed);
      }
      .stack-table td.hex.written {
        box-shadow: inset 0 -3px 0 var(--written);
        font-weight: 600;
      }
      .stack-table tr.gap td {
        color: var(--muted);
        text-align: center;
      }
      /* Interrupts panel (Stage 17): the CPU's interrupt inputs and the vectors. */
      .interrupt-inputs {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 8px 0 6px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .interrupt-inputs dt {
        color: var(--muted);
      }
      .interrupt-inputs dd {
        margin: 0;
      }
      .interrupt-inputs dd.active {
        color: var(--accent);
        font-weight: 600;
      }
      .interrupt-verdict {
        margin: 0 0 6px;
        font-size: 0.85rem;
      }
      .vector-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .vector-table th {
        color: var(--muted);
        font-weight: normal;
        text-align: left;
        padding: 1px 10px 1px 2px;
      }
      .vector-table td {
        padding: 1px 10px 1px 3px;
      }
      /* Memory map panel (Stage 21). */
      .map-bar {
        display: flex;
        gap: 2px;
        margin: 0 0 8px;
        font-size: 0.75rem;
      }
      .map-block {
        flex-basis: 0;
        min-width: 3.6em;
        padding: 6px 4px;
        border-radius: 3px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .map-block.pc {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        font-weight: 600;
      }
      .region-ram { --region: var(--region-ram); }
      .region-sideways { --region: var(--region-sideways); }
      .region-mos { --region: var(--region-mos); }
      .region-fred { --region: var(--region-fred); }
      .region-jim { --region: var(--region-jim); }
      .region-sheila { --region: var(--region-sheila); }
      .map-block,
      .map-regions td.swatch {
        background: var(--region);
      }
      .map-table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .map-table th {
        text-align: left;
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
      }
      .map-table td {
        padding: 2px 10px 2px 3px;
        vertical-align: top;
      }
      .map-table td.mono,
      .map-table td.count,
      .map-table td.direction {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        white-space: nowrap;
      }
      .map-table td.count {
        text-align: right;
      }
      .map-regions td.swatch {
        width: 0.9em;
        border-radius: 3px;
      }
      .map-regions td.detail,
      .map-slots td.placeholder,
      .map-note {
        color: var(--muted);
      }
      .map-regions tr.pc td.name {
        color: var(--accent);
        font-weight: 600;
      }
      .map-slots tr.used td {
        background: var(--changed);
      }
      .map-log tr.write td.direction {
        color: var(--written);
        font-weight: 600;
      }
      .map-heading {
        margin: 12px 0 4px;
        font-size: 0.85rem;
      }
      .map-note {
        margin: 0 0 4px;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>BBC Micro Model B</h1>
    <div class="layout">
      <div class="screen-column">
        <canvas id="screen" width="640" height="512"></canvas>
        <div id="under-screen"></div>
      </div>
      <aside id="workbench" aria-label="Workbench"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
