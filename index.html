<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBC Micro</title>
    <!-- No favicon yet: an empty data: URL stops the browser requesting /favicon.ico (a 404). -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f6f6f4;
        --fg: #1d1d1b;
        --muted: #6b6b66;
        --panel: #ffffff;
        --border: #d6d6d0;
        --accent: #b3261e;
        --changed: #ffe08a;
        --written: #1565c0;
        --error: #b3261e;
        --flag-on: #2e7d32;
        --flag-on-fg: #ffffff;
        /* Memory map regions (Stage 21). */
        --region-ram: #c8e6c9;
        --region-sideways: #ffe0b2;
        --region-mos: #bbdefb;
        --region-fred: #e1bee7;
        --region-jim: #f8bbd0;
        --region-sheila: #ffcdd2;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161614;
          --fg: #e8e8e3;
          --muted: #9a9a92;
          --panel: #20201d;
          --border: #3a3a35;
          --accent: #ff8a80;
          --changed: #6b5413;
          --written: #64b5f6;
          --error: #ff8a80;
          --flag-on: #66bb6a;
          --flag-on-fg: #0b1f0c;
          --region-ram: #1f3d22;
          --region-sideways: #4a3313;
          --region-mos: #17324d;
          --region-fred: #3d2342;
          --region-jim: #4a1f30;
          --region-sheila: #4d1f1f;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.4rem;
      }
      .layout {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
      .screen-column {
        flex: 0 1 640px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      /* The screen: the canvas shows MODE 7 as SAA5050 dots (Stage 31), and
         MODE 7's text lies over it, transparent, for screen readers and
         copy-paste. 640 pixels wide, or narrower on a small window; the
         text scales with it (cqw: 1% of the frame's width). */
      .screen-frame {
        position: relative;
        width: 640px;
        max-width: 100%;
        container-type: inline-size;
      }
      /* The canvas is 480 × 500 in MODE 7 (half dots × interlaced lines)
         and 640 × 256 in MODE 0-6 (16 MHz dots × scanlines, Stage 42). Both
         are the same TV picture, stretched to the same 5:4 frame: each
         bitmap line shows twice, as the TV's two interlace-sync fields do.
         pixelated: each dot stays a sharp rectangle. */
      #screen {
        display: block;
        background: #000;
        width: 100%;
        height: auto;
        aspect-ratio: 5 / 4;
        image-rendering: pixelated;
      }
      .text-screen {
        position: absolute;
        inset: 0;
        margin: 0;
        display: grid;
        grid-template-rows: repeat(25, 1fr);
        align-items: center;
        /* Invisible but there: the canvas is what you see. */
        color: transparent;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        /* 40 characters across the frame: a monospace character is about
           0.6em wide, so 40 × 0.6 × 4.1cqw ≈ 98% of the width. */
        font-size: 4.1cqw;
        line-height: 1;
        white-space: pre;
        overflow: hidden;
        /* Its size comes from the frame, never its text: so a changed row
           only relayouts the grid, not the page. */
        contain: strict;
      }
      .text-row {
        display: block;
        overflow: hidden;
      }
      .run-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: -8px;
      }
      .run-status {
        font-size: 0.85rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .run-status.error {
        color: var(--error);
      }
      #under-screen .panel:last-child {
        margin-bottom: 0;
      }
      #workbench {
        flex: 1 1 560px;
        min-width: 0;
      }
      .machine-switch {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: baseline;
        margin: 0 0 4px;
        font-size: 0.9rem;
      }
      .machine-switch a {
        color: var(--fg);
      }
      .machine-switch a[aria-current='page'] {
        font-weight: 600;
        text-decoration: none;
      }
      .machine-switch .rom-status {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .workbench-target {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px 12px;
        margin-bottom: 16px;
        overflow-x: auto;
      }
      .panel h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px;
        font-size: 0.95rem;
      }
      .panel > [hidden] {
        display: none !important;
      }
      .panel.collapsed {
        padding-bottom: 8px;
      }
      .panel.collapsed h2 {
        margin-bottom: 0;
      }
      .panel-toggle {
        width: 1.6em;
        height: 1.6em;
        padding: 0;
        line-height: 1;
        font-size: 0.95rem;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .memory-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .memory-message {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .memory-message.error {
        color: var(--error);
      }
      .memory-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .memory-table th {
        color: var(--muted);
        font-weight: normal;
        padding: 1px 6px 1px 2px;
        text-align: left;
      }
      .memory-table td {
        padding: 1px 3px;
      }
      .memory-table td.byte {
        cursor: pointer;
        border-radius: 3px;
      }
      .memory-table td.byte:hover {
        outline: 1px solid var(--accent);
      }
      .memory-table td.byte.changed {
        background: var(--changed);
      }
      /* Written by the CPU in the last run: a bar under the byte, so it can
         combine with the "changed" fill and the PC outline. */
      .memory-table td.byte.written {
        box-shadow: inset 0 -3px 0 var(--written);
        font-weight: 600;
      }
      .memory-writes {
        margin: 8px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .memory-writes .write-link {
        font: inherit;
        font-family: ui-monospace, monospace;
        color: var(--written);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
      }
      .memory-table td.byte.pc {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .memory-table td.ascii {
        padding-left: 10px;
        white-space: pre;
      }
      .byte-edit {
        width: 2.5ch;
        font: inherit;
        padding: 0;
      }
      .registers-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.9rem;
      }
      .registers-table th {
        text-align: left;
        padding: 1px 12px 1px 2px;
        color: var(--muted);
        font-weight: normal;
      }
      .registers-table td {
        padding: 1px 12px 1px 2px;
      }
      .registers-table td.binary {
        white-space: pre;
      }
      .registers-table .bit {
        color: var(--muted);
      }
      .registers-table .bit.on {
        color: inherit;
        font-weight: bold;
      }
      .registers-table .bit.changed {
        background: var(--changed);
        border-radius: 2px;
      }
      .registers-table td.detail {
        color: var(--muted);
      }
      .registers-table tr.changed td.value {
        background: var(--changed);
      }
      .flags {
        display: flex;
        gap: 4px;
        margin: 8px 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .flag {
        display: inline-block;
        width: 1.8em;
        text-align: center;
        padding: 2px 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
      }
      .flag.on {
        background: var(--flag-on);
        border-color: var(--flag-on);
        color: var(--flag-on-fg);
      }
      .flag.not-stored {
        border-style: dashed;
        opacity: 0.55;
      }
      .flag.changed {
        outline: 2px solid var(--changed);
      }
      .cpu-line {
        margin: 4px 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .cpu-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      .cpu-message {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .cpu-message.error {
        color: var(--error);
      }
      .listing-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .listing-table th {
        text-align: left;
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
      }
      .listing-table td {
        padding: 1px 10px 1px 2px;
        white-space: nowrap;
      }
      .listing-table td.marker {
        color: var(--accent);
        width: 1ch;
      }
      .listing-table td.comment {
        color: var(--muted);
        font-family: system-ui, sans-serif;
      }
      .listing-table tr.current td {
        background: var(--changed);
      }
      .listing-table tr.current td.comment {
        color: var(--fg);
      }
      .listing-table tr.modified td.bytes {
        text-decoration: line-through;
      }
      .disasm-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 4px;
      }
      .disasm-message {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .disasm-message.error {
        color: var(--error);
      }
      .disasm-heading {
        margin: 8px 0 2px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .disasm-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .disasm-table th {
        text-align: left;
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
      }
      .disasm-table td {
        padding: 1px 10px 1px 2px;
        white-space: nowrap;
      }
      .disasm-table td.marker {
        color: var(--accent);
        width: 1ch;
      }
      .disasm-table td.label {
        color: var(--written);
      }
      .disasm-table td.when {
        color: var(--muted);
        font-family: system-ui, sans-serif;
      }
      .disasm-ran td {
        color: var(--muted);
      }
      .disasm-ran tr.changed-since td.bytes {
        text-decoration: line-through;
      }
      .disasm-next tr.current td {
        background: var(--changed);
      }
      .disasm-empty,
      .disasm-interrupt,
      .disasm-note {
        margin: 4px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .disasm-interrupt {
        color: var(--accent);
      }
      .listing-note {
        margin: 6px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .asm-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .asm-source {
        box-sizing: border-box;
        width: 100%;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
        line-height: 1.4;
        tab-size: 8;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        resize: vertical;
      }
      .asm-status {
        margin: 6px 0 0;
        font-size: 0.85rem;
      }
      .asm-status.error {
        color: var(--error);
      }
      .asm-errors {
        margin: 4px 0 0;
        padding-left: 1.4em;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
        color: var(--error);
      }
      .asm-errors:empty {
        display: none;
      }
      .asm-symbols {
        margin: 4px 0 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .explorer-form,
      .explorer-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 0.85rem;
      }
      .explorer-field input,
      .explorer-field select {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .explorer-presets {
        gap: 6px;
        color: var(--muted);
      }
      .explorer-instruction {
        margin: 8px 0 4px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .explorer-instruction code {
        font-weight: bold;
        margin-right: 16px;
      }
      .explorer-bytes {
        color: var(--muted);
      }
      .explorer-steps {
        margin: 4px 0;
        padding-left: 1.6em;
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .explorer-steps li.warn {
        background: var(--changed);
        border-radius: 3px;
      }
      .explorer-result,
      .explorer-cycles {
        margin: 4px 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .explorer-result.error {
        color: var(--error);
      }
      .converter-form {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        max-width: 22rem;
        font-size: 0.85rem;
      }
      .converter-field {
        display: contents;
      }
      .converter-field input {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        min-width: 0;
      }
      .converter-field input[aria-invalid='true'] {
        outline: 2px solid var(--error);
      }
      .converter-status {
        margin: 8px 0 4px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .converter-status.error {
        color: var(--error);
      }
      .converter-notes {
        margin: 4px 0 0;
        padding-left: 1.4em;
        font-size: 0.8rem;
        line-height: 1.5;
        color: var(--muted);
      }
      /* Stack panel (Stage 15): page 1 from &01FF down to just below S. */
      .stack-summary {
        margin: 0 0 6px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      /* Stage 16: where an RTS would go if it ran now. */
      .stack-rts {
        margin: -2px 0 6px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .stack-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .stack-table th {
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
        text-align: left;
      }
      .stack-table td {
        padding: 1px 10px 1px 3px;
      }
      .stack-table tr.free td,
      .stack-table tr.free th {
        opacity: 0.45;
      }
      .stack-table tr.next-push {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .stack-table td.note {
        color: var(--muted);
      }
      .stack-table tr.next-push td.note {
        color: var(--accent);
        font-weight: 600;
      }
      .stack-table td.hex.changed {
        background: var(--changed);
      }
      .stack-table td.hex.written {
        box-shadow: inset 0 -3px 0 var(--written);
        font-weight: 600;
      }
      .stack-table tr.gap td {
        color: var(--muted);
        text-align: center;
      }
      /* Interrupts panel (Stage 17): the CPU's interrupt inputs and the vectors. */
      .interrupt-inputs {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 8px 0 6px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .interrupt-inputs dt {
        color: var(--muted);
      }
      .interrupt-inputs dd {
        margin: 0;
      }
      .interrupt-inputs dd.active {
        color: var(--accent);
        font-weight: 600;
      }
      .interrupt-verdict {
        margin: 0 0 6px;
        font-size: 0.85rem;
      }
      .vector-table {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.85rem;
      }
      .vector-table th {
        color: var(--muted);
        font-weight: normal;
        text-align: left;
        padding: 1px 10px 1px 2px;
      }
      .vector-table td {
        padding: 1px 10px 1px 3px;
      }
      /* Memory map panel (Stage 21). */
      .map-bar {
        display: flex;
        gap: 2px;
        margin: 0 0 8px;
        font-size: 0.75rem;
      }
      .map-block {
        flex-basis: 0;
        min-width: 3.6em;
        padding: 6px 4px;
        border-radius: 3px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .map-block.pc {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        font-weight: 600;
      }
      .region-ram { --region: var(--region-ram); }
      .region-sideways { --region: var(--region-sideways); }
      .region-mos { --region: var(--region-mos); }
      .region-fred { --region: var(--region-fred); }
      .region-jim { --region: var(--region-jim); }
      .region-sheila { --region: var(--region-sheila); }
      .map-block,
      .map-regions td.swatch {
        background: var(--region);
      }
      .map-table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .map-table th {
        text-align: left;
        color: var(--muted);
        font-weight: normal;
        padding: 1px 10px 1px 2px;
      }
      .map-table td {
        padding: 2px 10px 2px 3px;
        vertical-align: top;
      }
      .map-table td.mono,
      .map-table td.count,
      .map-table td.direction {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        white-space: nowrap;
      }
      .map-table td.count {
        text-align: right;
      }
      .map-regions td.swatch {
        width: 0.9em;
        border-radius: 3px;
      }
      .map-regions td.detail,
      .map-slots td.placeholder,
      .map-note {
        color: var(--muted);
      }
      .map-regions tr.pc td.name {
        color: var(--accent);
        font-weight: 600;
      }
      .map-slots tr.used td {
        background: var(--changed);
      }
      .map-log tr.write td.direction {
        color: var(--written);
        font-weight: 600;
      }
      .map-heading {
        margin: 12px 0 4px;
        font-size: 0.85rem;
      }
      .map-note {
        margin: 0 0 4px;
        font-size: 0.8rem;
      }
      /* Keyboard panel (Stage 34): the desk view and the matrix view. */
      .screen-frame:focus {
        outline: none;
      }
      .screen-frame:focus-visible,
      .screen-frame.typing {
        outline: 3px solid var(--flag-on);
        outline-offset: 2px;
      }
      .keyboard-status {
        margin: 0 0 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .keyboard-scan {
        margin: -4px 0 8px;
        font-size: 0.8rem;
        font-family: var(--mono, monospace);
        color: var(--muted);
      }
      .keyboard-status .active {
        color: var(--flag-on);
        font-weight: 600;
      }
      .bbc-keyboard {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin: 0 0 10px;
      }
      .bbc-key-row {
        display: flex;
        gap: 3px;
      }
      .bbc-key {
        flex-basis: 0;
        min-width: 0;
        padding: 2px 0;
        font-size: 0.6rem;
        line-height: 1.15;
        overflow: hidden;
        overflow-wrap: anywhere;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
      }
      .bbc-key .shifted {
        color: var(--muted);
      }
      .bbc-key.not-in-matrix {
        border-style: dashed;
      }
      /* Stage 36: the lock LEDs, on the keycaps and under the screen. */
      .key-led,
      .led-light {
        display: inline-block;
        width: 0.55em;
        height: 0.55em;
        margin-right: 0.3em;
        border-radius: 50%;
        background: var(--border);
        vertical-align: baseline;
      }
      .key-led.lit,
      .lock-led.lit .led-light {
        background: #e53935;
        box-shadow: 0 0 4px #e53935;
      }
      /* Stage 46: the sound switch and what the audio thread is doing. */
      .sound-control {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
      }
      .sound-status {
        font-size: 0.75rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .sound-status.error {
        color: var(--error);
      }
      .lock-leds {
        display: inline-flex;
        gap: 10px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .bbc-key.down,
      .key-matrix td.down {
        background: var(--flag-on);
        border-color: var(--flag-on);
        color: var(--flag-on-fg);
      }
      .bbc-key.down .shifted {
        color: inherit;
      }
      .key-matrix {
        border-collapse: collapse;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.7rem;
      }
      .key-matrix th {
        color: var(--muted);
        font-weight: normal;
        padding: 1px 4px;
      }
      .key-matrix td {
        border: 1px solid var(--border);
        text-align: center;
        min-width: 2.6em;
        padding: 2px 3px;
      }
      .key-matrix td.link {
        border-style: dashed;
        color: var(--muted);
      }
      /* VIA panel (Stage 24). */
      .via-picker {
        display: flex;
        gap: 4px;
        margin: 0 0 8px;
      }
      .via-picker button[aria-pressed='true'] {
        background: var(--flag-on);
        border-color: var(--flag-on);
        color: var(--flag-on-fg);
      }
      .via-table {
        border-collapse: collapse;
        font-size: 0.85rem;
        margin: 0 0 8px;
      }
      .via-table th {
        text-align: left;
        color: var(--muted);
        font-weight: normal;
        padding: 1px 8px 1px 2px;
      }
      .via-table td {
        padding: 1px 8px 1px 3px;
      }
      .via-table td.mono,
      .via-port td,
      .via-port thead th {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .via-registers tr.stub td {
        color: var(--muted);
      }
      .via-registers td.status {
        font-size: 0.75rem;
      }
      .via-port caption {
        text-align: left;
        font-weight: 600;
        padding: 4px 0 2px;
      }
      .via-port td.bit {
        text-align: center;
        min-width: 2.2em;
        padding: 1px 2px;
      }
      .via-port thead th.out,
      .via-port td.bit.out {
        background: color-mix(in srgb, var(--written) 12%, transparent);
      }
      .via-port td.unused {
        color: var(--muted);
      }
      .via-port td.low {
        font-weight: 600;
      }
      .via-port tr[data-row='read'] td.from-register {
        box-shadow: inset 0 -2px 0 var(--written);
      }
      .via-port td.hex {
        padding-left: 8px;
      }
      .via-outside {
        font: inherit;
        min-width: 1.8em;
        padding: 0 4px;
      }
      .via-outside.pulled {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--panel);
      }
      .via-timers caption {
        text-align: left;
        font-weight: 600;
        padding: 4px 0 2px;
      }
      .via-timers td.counter {
        min-width: 9em;
      }
      .via-timers td.mode,
      .via-timers td.ifr-flag {
        font-size: 0.8rem;
      }
      .via-timers td.ifr-flag.set {
        color: var(--accent);
        font-weight: 600;
      }
      .via-timer-bar {
        width: 80px;
        height: 8px;
        border: 1px solid var(--muted);
      }
      .via-timer-bar > div {
        height: 100%;
        background: var(--written);
      }
      .via-ifr {
        margin: 0 0 8px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .via-port td.bit.timer {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        font-weight: 600;
      }
      .via-interrupts caption,
      .via-control-lines caption {
        text-align: left;
        font-weight: 600;
        padding: 4px 0 2px;
      }
      .via-interrupts.irq caption {
        color: var(--accent);
      }
      .via-interrupts tr.stub td,
      .via-interrupts td.wired,
      .via-control-lines td.wired,
      .via-control-lines td.driven {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .via-interrupts td.ifr-bit,
      .via-interrupts td.ier-bit {
        text-align: center;
      }
      .via-interrupts td.set {
        font-weight: 600;
      }
      .via-interrupts tr.firing td {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .via-interrupts td.firing {
        color: var(--accent);
        font-weight: 600;
      }
      .via-control-lines td.mode {
        font-size: 0.8rem;
      }
      .via-control-lines td.level.low {
        font-weight: 600;
      }
      .via-note {
        margin: 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      /* CRTC panel (Stage 37) */
      .crtc-summary {
        margin: 0 0 6px;
        font-weight: 600;
      }
      .crtc-frame {
        position: relative;
        width: 100%;
        max-width: 320px;
        aspect-ratio: 4 / 3;
        border: 1px solid var(--muted);
        background: color-mix(in srgb, var(--muted) 12%, transparent);
        overflow: hidden;
      }
      .crtc-frame > div {
        position: absolute;
      }
      .crtc-displayed {
        background: var(--panel);
        outline: 1px solid var(--fg);
        outline-offset: -1px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .crtc-hsync {
        background: color-mix(in srgb, var(--written) 55%, transparent);
      }
      .crtc-vsync {
        background: color-mix(in srgb, var(--accent) 70%, transparent);
        min-height: 2px;
      }
      .crtc-beam {
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: var(--fg);
        box-shadow: 0 0 0 1px var(--panel);
      }
      .crtc-counters {
        padding-bottom: 6px;
        border-bottom: 1px solid color-mix(in srgb, var(--muted) 30%, transparent);
      }
      .crtc-legend {
        margin: 2px 0 8px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .crtc-geometry {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 1px 10px;
        margin: 0 0 8px;
        font-size: 0.85rem;
      }
      .crtc-geometry dt {
        color: var(--muted);
      }
      .crtc-geometry dd {
        margin: 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .crtc-table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .crtc-table th {
        color: var(--muted);
        font-weight: normal;
        padding: 1px 8px 1px 2px;
        text-align: left;
      }
      .crtc-table td {
        padding: 1px 8px 1px 3px;
      }
      .crtc-table td.hex,
      .crtc-table td.access {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .crtc-table td.hex.changed {
        background: var(--changed);
      }
      .crtc-table td.access,
      .crtc-table td.meaning {
        color: var(--muted);
      }
      .crtc-table tr.selected {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      /* Video ULA panel (Stage 40) */
      .ula-summary {
        margin: 0 0 6px;
        font-weight: 600;
      }
      .ula-fields {
        margin-bottom: 8px;
      }
      .ula-fields td.value {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .ula-swatches {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
        max-width: 480px;
      }
      .ula-swatch {
        font-size: 0.7rem;
        line-height: 1.2;
        text-align: center;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .ula-chip {
        height: 28px;
        border: 1px solid var(--muted);
        border-radius: 3px;
        margin-bottom: 2px;
      }
      .ula-swatch.flashing .ula-chip {
        outline: 2px dashed var(--accent);
        outline-offset: 1px;
      }
      .ula-swatch .ula-name {
        color: var(--muted);
        font-family: system-ui, sans-serif;
      }
      .ula-note {
        margin: 6px 0 0;
        font-size: 0.75rem;
        color: var(--muted);
      }
      /* Sound panel (Stage 44) */
      .sound-summary {
        margin: 0 0 6px;
        font-weight: 600;
      }
      .sound-channels tr.silent td,
      .sound-channels tr.silent th {
        color: var(--muted);
      }
      .sound-level {
        width: 90px;
        height: 10px;
        border: 1px solid var(--border);
        border-radius: 2px;
      }
      .sound-level-bar {
        height: 100%;
        background: var(--flag-on);
      }
      .sound-latched,
      .sound-bytes-heading {
        margin: 6px 0 2px;
        font-size: 0.85rem;
      }
      .sound-bytes {
        margin: 0;
        padding-left: 1.6em;
        font-size: 0.8rem;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        white-space: pre;
      }
      /* Byte explorer (Stage 41) */
      .explorer-form {
        display: flex;
        gap: 12px;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .explorer-form input {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .explorer-form input.invalid {
        outline: 2px solid #c33;
      }
      .explorer-summary {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-weight: 600;
      }
      .explorer-bits,
      .explorer-owners,
      .explorer-pixels {
        display: flex;
        gap: 2px;
        max-width: 480px;
      }
      .explorer-bits button {
        flex: 1 1 0;
        min-width: 0;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.75rem;
      }
      .explorer-bits button[aria-pressed='true'] {
        background: var(--accent);
        color: #fff;
      }
      .explorer-mode {
        margin-top: 8px;
      }
      .explorer-heading {
        margin: 0 0 2px;
        font-size: 0.8rem;
      }
      .explorer-owners span {
        flex: 1 1 0;
        min-width: 0;
        text-align: center;
        font-size: 0.65rem;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        color: #222;
        border-radius: 2px;
      }
      .explorer-owners .owner-0 { background: #fde2c8; }
      .explorer-owners .owner-1 { background: #d6e8fb; }
      .explorer-owners .owner-2 { background: #dff3d6; }
      .explorer-owners .owner-3 { background: #efdcf5; }
      .explorer-owners .owner-4 { background: #fbf3c4; }
      .explorer-owners .owner-5 { background: #d3f1ef; }
      .explorer-owners .owner-6 { background: #f6d3d9; }
      .explorer-owners .owner-7 { background: #e1e1e1; }
      .explorer-pixels {
        margin-top: 2px;
      }
      .explorer-pixel {
        flex: 1 1 0;
        min-width: 0;
        height: 32px;
        padding: 0;
        border: 1px solid var(--muted);
        border-radius: 2px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.7rem;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      button.explorer-pixel {
        cursor: pointer;
      }
      .explorer-pixel.flashing {
        outline: 2px dashed var(--accent);
        outline-offset: -3px;
      }
      /* Disc panel (Stage 48) */
      .disc-drop {
        display: block;
        padding: 10px;
        border: 2px dashed var(--border);
        border-radius: 4px;
        font-size: 0.85rem;
      }
      .disc-drop.dragging {
        border-color: var(--written);
      }
      .disc-note,
      .disc-summary {
        margin: 6px 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .disc-status {
        margin: 6px 0;
        font-weight: 600;
      }
      .disc-status.error,
      .disc-error,
      .disc-problems {
        color: var(--error);
      }
      .disc-drive {
        margin: 10px 0 4px;
        font-size: 0.9rem;
      }
      .disc-cat {
        margin: 0;
        padding: 8px;
        background: #000;
        color: #fff;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.8rem;
        line-height: 1.3;
        overflow-x: auto;
      }
      .disc-files caption {
        text-align: left;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .disc-files td {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      .disc-problems {
        font-size: 0.8rem;
        padding-left: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>BBC Micro Model B</h1>
    <div class="layout">
      <div class="screen-column">
        <div class="screen-frame">
          <canvas id="screen" width="480" height="500" aria-hidden="true"></canvas>
        </div>
        <div id="under-screen"></div>
      </div>
      <aside id="workbench" aria-label="Workbench"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
